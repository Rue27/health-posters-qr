<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Awareness Posters</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .image-wrapper {
            flex: 0 1 calc(50% - 20px);
            min-width: 300px;
        }
        .image-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        @media (max-width: 768px) {
            .image-wrapper {
                flex: 0 1 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Health Awareness Posters</h1>
        <div class="image-container">
            <div class="image-wrapper">
                <img src="image1.jpg" alt="Health Poster 1">
            </div>
            <div class="image-wrapper">
                <img src="image2.jpg" alt="Health Poster 2">
            </div>
            <div class="image-wrapper">
                <img src="image3.jpg" alt="Health Poster 3">
            </div>
            <div class="image-wrapper">
                <img src="image4.jpg" alt="Health Poster 4">
            </div>
            <div class="image-wrapper">
                <img src="image5.jpg" alt="Health Poster 5">
            </div>
        </div>
    </div>
</body>
</html>
